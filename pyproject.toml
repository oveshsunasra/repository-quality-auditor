[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-quality-auditor"
description = "Evidence-backed agentic system that evaluates an unfamiliar software repository"
authors = [
    {name = "Ovesh Unasra", email = "ovesh@example.com"}
]
version = "0.1.0"
dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.0.0",
    "openai>=1.0.0",
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["code quality", "audit", "repository analysis", "static analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
"Homepage" = "https://github.com/oveshsunasra/repository-quality-auditor"
"Bug Tracker" = "https://github.com/oveshsunasra/repository-quality-auditor/issues"

[project.scripts]
auditor = "auditor.cli:main"

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--strict-markers"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]